<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>入試漢文ドリル</title>
<script>
/* 描画前にテーマを決めてちらつきを防ぐ：自分で選んだテーマ → なければOSの設定 */
(function () {
  var t = null;
  try { t = localStorage.getItem("kanbun-drill-theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one centered column (max 760px) under a translucent sticky header (brand + light/dark switch, then three view tabs).
   Style: 学習アプリ UI Style Guide — 静かなネイビーのニュートラル（H265）＋ Ink の主要ボタン ＋ 1画面1色のアクセント（オレンジ＝朱）。
   意味色は固定：覚えた／正解＝グリーン、あいまい＝アンバー、不正解＝コーラル。教材は 句形＝バイオレット、成句＝ティール、単語＝ピンク。
   見出しの漢文は縦書き（明朝）、答えは横書き。 */

/* ============ Tokens : Light (default) ============ */
:root {
  --font: 'Manrope', 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --kan: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', 'YuMincho', 'Noto Serif JP', serif;

  --bg: oklch(.985 .004 265);
  --surface: oklch(.995 .002 265);
  --surface-2: oklch(.965 .006 265);
  --surface-3: oklch(.94 .008 265);
  --border: oklch(.90 .008 265);
  --border-strong: oklch(.82 .010 265);
  --text: oklch(.22 .02 265);
  --text-2: oklch(.45 .02 265);
  --text-3: oklch(.53 .02 265);

  --ink: oklch(.30 .07 268);
  --ink-hover: oklch(.38 .08 268);
  --on-ink: oklch(.985 .004 265);
  --on-accent: oklch(.20 .03 265);

  --a-l: .72;
  --atx-l: .46;

  --sh-1: 0 1px 2px oklch(.25 .03 265 / .08);
  --sh-2: 0 1px 2px oklch(.25 .03 265 / .06), 0 12px 28px -12px oklch(.25 .03 265 / .24);
  --sh-3: 0 28px 56px -18px oklch(.25 .04 265 / .38);
  --scrim: oklch(.22 .03 265 / .42);

  --dur-fast: 120ms;
  --dur-base: 200ms;
  --dur-slow: 360ms;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-io: cubic-bezier(.65, 0, .35, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 24px;

  --h: 55;
  --c: .15;
  color-scheme: light;
}

/* ============ Tokens : Dark ============ */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(.17 .012 265);
    --surface: oklch(.215 .014 265);
    --surface-2: oklch(.25 .015 265);
    --surface-3: oklch(.29 .016 265);
    --border: oklch(.32 .016 265);
    --border-strong: oklch(.42 .018 265);
    --text: oklch(.95 .006 265);
    --text-2: oklch(.76 .012 265);
    --text-3: oklch(.65 .014 265);
    --ink: oklch(.93 .03 268);
    --ink-hover: oklch(.99 .01 268);
    --on-ink: oklch(.20 .03 265);
    --a-l: .76;
    --atx-l: .82;
    --sh-1: 0 1px 2px oklch(0 0 0 / .4);
    --sh-2: 0 1px 2px oklch(0 0 0 / .3), 0 12px 28px -12px oklch(0 0 0 / .65);
    --sh-3: 0 28px 56px -18px oklch(0 0 0 / .75);
    --scrim: oklch(.08 .01 265 / .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(.17 .012 265);
  --surface: oklch(.215 .014 265);
  --surface-2: oklch(.25 .015 265);
  --surface-3: oklch(.29 .016 265);
  --border: oklch(.32 .016 265);
  --border-strong: oklch(.42 .018 265);
  --text: oklch(.95 .006 265);
  --text-2: oklch(.76 .012 265);
  --text-3: oklch(.65 .014 265);
  --ink: oklch(.93 .03 268);
  --ink-hover: oklch(.99 .01 268);
  --on-ink: oklch(.20 .03 265);
  --a-l: .76;
  --atx-l: .82;
  --sh-1: 0 1px 2px oklch(0 0 0 / .4);
  --sh-2: 0 1px 2px oklch(0 0 0 / .3), 0 12px 28px -12px oklch(0 0 0 / .65);
  --sh-3: 0 28px 56px -18px oklch(0 0 0 / .75);
  --scrim: oklch(.08 .01 265 / .6);
  color-scheme: dark;
}

/* ============ Accent palette ============ */
/* 色相だけを変えた10色のうち、このアプリで使う色。要素に .acc と .a-* を付けるとその要素以下のアクセントが切り替わる */
.a-coral { --h: 25; --c: .15; }
.a-orange { --h: 55; --c: .15; }
.a-amber { --h: 85; --c: .14; }
.a-green { --h: 155; --c: .14; }
.a-teal, .dk-s { --h: 190; --c: .11; }
.a-blue { --h: 260; --c: .13; }
.a-violet, .dk-k { --h: 295; --c: .15; }
.a-pink, .dk-w { --h: 350; --c: .16; }
:root, .acc, .dk-k, .dk-s, .dk-w {
  --accent: oklch(var(--a-l) var(--c) var(--h));
  --accent-strong: oklch(calc(var(--a-l) - .08) var(--c) var(--h));
  --accent-text: oklch(var(--atx-l) calc(var(--c) * .9) var(--h));
  --accent-soft: color-mix(in oklab, var(--accent) 15%, var(--surface));
  --accent-line: color-mix(in oklab, var(--accent) 40%, var(--surface));
}
/* 意味色（アクセントの選択に関わらず固定）と、返り点の朱（＝主役のアクセント） */
:root {
  --ok: oklch(var(--a-l) .14 155);
  --ok-text: oklch(var(--atx-l) .126 155);
  --mid: oklch(var(--a-l) .14 85);
  --ng-text: oklch(var(--atx-l) .135 25);
  --shu: oklch(var(--atx-l) .135 55);
}

/* ============ Base ============ */
* { box-sizing: border-box; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; text-wrap: pretty; word-break: auto-phrase; }
button, select, input { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; }
@media (min-width: 640px) { .wrap { padding-inline: 24px; } }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* テーマ切り替えの 360ms だけ、背景・文字・線の色をなめらかに補間する */
html.theme-anim *:not(.seg-ind), html.theme-anim *::before, html.theme-anim *::after {
  transition: background-color var(--dur-slow) var(--ease-out), border-color var(--dur-slow) var(--ease-out), color var(--dur-slow) var(--ease-out), fill var(--dur-slow) var(--ease-out), stroke var(--dur-slow) var(--ease-out), box-shadow var(--dur-slow) var(--ease-out) !important;
}

/* ============ Type ============ */
.over { font: 700 11px/1.4 var(--font); letter-spacing: .12em; color: var(--text-3); }
.h2 { font: 700 24px/1.4 var(--font); color: var(--text); }
.h3 { font: 700 18px/1.5 var(--font); color: var(--text); }
.cap { font: 500 12px/1.5 var(--font); letter-spacing: .02em; color: var(--text-3); }
.note { font: 400 13px/1.7 var(--font); color: var(--text-2); }
.big { font: 700 36px/1 var(--font); letter-spacing: -.01em; color: var(--text); font-variant-numeric: tabular-nums; }
.big small { font: 600 14px/1 var(--font); letter-spacing: 0; color: var(--text-2); margin-left: 6px; }

/* ============ Header ============ */
.top { position: sticky; top: 0; z-index: 10; padding-top: env(safe-area-inset-top, 0px); background: color-mix(in oklab, var(--bg) 84%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--border); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; padding-block: 8px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font: 700 15px/1 var(--font); letter-spacing: .02em; color: var(--text); min-width: 0; white-space: nowrap; }
.logo { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 700 18px/1 var(--kan); flex: none; }

/* segmented control（テーマ切り替え・出題設定） */
.seg { --n: 2; --i: 0; position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-3); border-radius: 99px; padding: 4px; }
.seg button { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 4px 14px; border: 0; background: none; border-radius: 99px; color: var(--text-2); font: 600 13px/1.3 var(--font); cursor: pointer; transition: color var(--dur-base) var(--ease-out); }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { color: var(--text); }
.seg-ind { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / var(--n)); border-radius: 99px; background: var(--surface); box-shadow: var(--sh-1); transform: translateX(calc(var(--i) * 100%)); transition: transform var(--dur-slow) var(--ease-spring); }
.seg.block { display: grid; width: 100%; }
.theme-seg button { white-space: nowrap; }
:root[data-theme="dark"] .theme-seg { --i: 1; }
@media (max-width: 479px) { .theme-seg .lbl { display: none; } .theme-seg button { padding-inline: 11px; } }

/* view tabs */
.vtabs { --i: 0; position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.vtab { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 8px; background: none; border: 0; border-radius: 10px 10px 0 0; color: var(--text-2); font: 600 14px/1 var(--font); cursor: pointer; white-space: nowrap; transition: color var(--dur-base) var(--ease-out), background-color var(--dur-fast) var(--ease-out); }
.vtab .ic { width: 16px; height: 16px; }
.vtab:hover { color: var(--text); background: color-mix(in oklab, var(--surface-3) 70%, transparent); }
.vtab[aria-selected="true"] { color: var(--accent-text); }
.vtab-ind { position: absolute; left: 0; bottom: -1px; height: 3px; width: 33.3333%; border-radius: 3px 3px 0 0; background: var(--accent); transform: translateX(calc(var(--i) * 100%)); transition: transform var(--dur-slow) var(--ease-out); }
@media (max-width: 359px) { .vtab .ic { display: none; } }

main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 24px 32px; }
main > * { min-width: 0; }
.rise { animation: rise calc(var(--dur-slow) * 2) var(--ease-out) var(--d, 0ms) both; }

/* ============ Cards / sections ============ */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: clamp(18px, 4.5vw, 24px); display: grid; gap: 16px; min-width: 0; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.row { display: flex; flex-wrap: wrap; gap: 12px; }
.row > .btn { flex: 1 1 160px; }
.row.end { justify-content: flex-end; }
.row.end > .btn { flex: 0 1 auto; min-width: 200px; }
@media (max-width: 479px) { .row.end > .btn { flex: 1 1 100%; } }

/* ============ Buttons ============ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 20px; border-radius: var(--r-md); border: 1px solid transparent; background: none; font: 600 15px/1.3 var(--font); text-align: center; cursor: pointer; transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-base) var(--ease-out), opacity var(--dur-base) var(--ease-out); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--ink); color: var(--on-ink); }
.btn.primary:hover:not(:disabled) { background: var(--ink-hover); }
.btn.accent { background: var(--accent); color: var(--on-accent); }
.btn.accent:hover:not(:disabled) { background: var(--accent-strong); box-shadow: 0 6px 16px -6px var(--accent); }
.btn.secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn.secondary:hover:not(:disabled) { background: var(--surface-2); }
.btn.ghost { background: transparent; color: var(--text-2); }
.btn.ghost:hover:not(:disabled) { background: var(--surface-3); color: var(--text); }
.btn.soft { background: var(--accent-soft); color: var(--accent-text); }
.btn.soft:hover:not(:disabled) { background: color-mix(in oklab, var(--accent) 26%, var(--surface)); }
.btn.sm { min-height: 36px; padding: 6px 14px; font-size: 13px; border-radius: 10px; }
.btn.lg { min-height: 52px; padding: 12px 28px; font-size: 16px; border-radius: 14px; }
.btn .arrow { transition: transform var(--dur-base) var(--ease-out); }
.btn:hover .arrow { transform: translateX(3px); }

/* ============ Chips / tags ============ */
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); font: 600 12px/1 var(--font); white-space: nowrap; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); flex: none; }
.chip.tint { background: var(--accent-soft); border-color: color-mix(in oklab, var(--accent) 22%, var(--surface)); color: var(--accent-text); }
.chip.tint .dot { background: var(--accent); }
.tag { display: inline-flex; align-items: center; min-height: 20px; padding: 0 7px; margin-right: 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-text); font: 700 11px/1 var(--font); letter-spacing: .02em; vertical-align: .18em; }
.alt { display: block; }
.alt + .alt { margin-top: 2px; }

/* ============ Progress ============ */
.stack { display: flex; height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.stack.thin { height: 6px; }
.stack i { display: block; height: 100%; }
.stack .k { background: var(--ok); }
.stack .m { background: var(--mid); }
.rise .stack i { animation: grow calc(var(--dur-slow) * 3) var(--ease-out) both; }
.prog { display: flex; align-items: center; gap: 12px; }
.prog .stack { flex: 1; }
.pct { font: 600 13px/1 var(--font); color: var(--text-2); min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pct b { font-size: 15px; font-weight: 700; color: var(--text); }
.track { flex: 1; min-width: 40px; height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width var(--dur-slow) var(--ease-out); }
.ring { position: relative; width: var(--s, 96px); height: var(--s, 96px); flex: none; }
.ring > svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.ring circle { fill: none; stroke-width: 3.4; }
.ring .trk { stroke: var(--surface-3); }
.ring .val { stroke-linecap: round; }
.ring .val.k { stroke: var(--ok); }
.ring .val.m { stroke: var(--mid); }
.ring .val.a { stroke: var(--accent); }
.rise .ring .val { animation: ring-draw calc(var(--dur-slow) * 4) var(--ease-out) both; }
.ring-n { position: absolute; inset: 0; display: grid; place-items: center; font: 700 calc(var(--s, 96px) * .24)/1 var(--font); color: var(--text); font-variant-numeric: tabular-nums; }
.ring-n small { font-size: .55em; font-weight: 600; color: var(--text-2); margin-left: 1px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.k { background: var(--ok); } .dot.m { background: var(--mid); } .dot.n { background: var(--border-strong); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { padding: 12px 14px; border-radius: var(--r-md); background: var(--surface-2); display: grid; gap: 4px; min-width: 0; }
.stat .lab { display: flex; align-items: flex-start; gap: 6px; font: 600 12px/1.4 var(--font); color: var(--text-2); overflow-wrap: anywhere; text-align: left; }
.stat .lab .dot { margin-top: 4.5px; }
.stat b { text-align: left; }
.stat b { font: 700 22px/1.1 var(--font); color: var(--text); font-variant-numeric: tabular-nums; }

/* ============ Home ============ */
.hero { gap: 20px; box-shadow: var(--sh-2); border-radius: var(--r-xl); }
.hero-h { display: flex; align-items: center; gap: 20px; }
.hero-t { display: grid; gap: 8px; min-width: 0; }
.decks { display: grid; gap: 16px; }
.deck { gap: 14px; }
.deck-top { display: flex; align-items: flex-start; gap: 14px; }
.dmark { width: 48px; height: 48px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; font: 700 22px/1 var(--kan); flex: none; }
.deck-t { min-width: 0; display: grid; gap: 2px; }
.deck-t h3 { font: 700 17px/1.4 var(--font); color: var(--text); }
.deck-t p { font: 400 13px/1.6 var(--font); color: var(--text-3); }
.grp-d summary { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px 0 8px; margin-left: -8px; border-radius: 10px; list-style: none; cursor: pointer; color: var(--text-2); font: 600 13px/1 var(--font); transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
.grp-d summary::-webkit-details-marker { display: none; }
.grp-d summary:hover { background: var(--surface-2); color: var(--text); }
.grp-d summary .count { display: inline-grid; place-items: center; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--surface-3); color: var(--text-2); font: 700 11px/1 var(--font); }
.chev { width: 16px; height: 16px; transition: transform var(--dur-base) var(--ease-out); }
details[open] > summary .chev { transform: rotate(180deg); }
.groups { display: grid; gap: 2px; margin-top: 6px; padding: 6px 12px; border-radius: var(--r-md); background: var(--surface-2); animation: fade var(--dur-slow) var(--ease-out) both; }
.grp { display: grid; grid-template-columns: minmax(0, 9.5em) 1fr auto; gap: 12px; align-items: center; min-height: 32px; font: 500 13px/1.4 var(--font); color: var(--text-2); }
.grp .stack { background: var(--surface-3); }
.grp .g-c { font: 600 12px/1 var(--font); color: var(--text-3); min-width: 3.6em; text-align: right; }
.history { display: grid; margin: 0; padding: 0; list-style: none; }
.history li { display: flex; align-items: center; gap: 12px; min-height: 56px; padding-block: 8px; border-top: 1px solid var(--border); }
.history li:first-child { border-top: 0; padding-top: 0; }
.history .h-t { flex: 1; min-width: 0; display: grid; }
.history .h-t b { font: 600 14px/1.4 var(--font); color: var(--text); }
.history .h-t span { font: 500 12px/1.5 var(--font); color: var(--text-3); }
.history .score { display: inline-flex; align-items: center; gap: 6px; font: 700 15px/1 var(--font); color: var(--text); white-space: nowrap; }
.history .score.good { color: var(--ok-text); }
.history .score .ic { width: 16px; height: 16px; stroke-width: 3; }

/* ============ Settings ============ */
.settings { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); }
.settings > summary { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px 8px 10px; list-style: none; cursor: pointer; border-radius: var(--r-lg); transition: background-color var(--dur-fast) var(--ease-out); }
.settings > summary::-webkit-details-marker { display: none; }
.settings > summary:hover { background: var(--surface-2); }
.settings[open] > summary { border-bottom: 1px solid var(--border); border-radius: var(--r-lg) var(--r-lg) 0 0; }
.sum-ic { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-3); color: var(--text-2); display: grid; place-items: center; flex: none; }
.sum-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 14px/1.4 var(--font); color: var(--text); }
.sum-r { display: inline-flex; align-items: center; gap: 4px; font: 600 13px/1 var(--font); color: var(--accent-text); white-space: nowrap; }
.controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.settings .controls { padding: 18px 16px 20px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
@media (max-width: 559px) { .controls { grid-template-columns: minmax(0, 1fr); } }
.label { font: 600 13px/1.4 var(--font); color: var(--text-2); }
.select { position: relative; }
.select select { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); padding: 0 40px 0 14px; font: 500 15px/1 var(--font); cursor: pointer; transition: border-color var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out); }
.select select:hover:not(:disabled) { border-color: var(--text-3); }

.select select:disabled { opacity: .5; cursor: not-allowed; background: var(--surface-2); }

.trk { position: relative; width: 48px; height: 28px; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--border-strong); flex: none; transition: background-color var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out); }
.thumb { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: var(--sh-1); transition: transform var(--dur-base) var(--ease-spring), background-color var(--dur-base) var(--ease-out); }

/* ============ Session bar ============ */
.sbar { display: flex; align-items: center; gap: 12px; font: 600 13px/1 var(--font); color: var(--text-2); min-height: 32px; }
.sbar b { font-size: 15px; color: var(--text); }
.sb-ok { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.sb-ok .ic { width: 15px; height: 15px; stroke-width: 3; color: var(--ok-text); }

/* ============ Vertical headword: each unit = 返り点 | 漢字 | 送り仮名 ============ */
.vterm { display: flex; flex-direction: row-reverse; justify-content: center; align-items: flex-start; gap: .55em; font-family: var(--kan); font-weight: 700; font-size: var(--vs, 2rem); line-height: 1; color: var(--text); }
.vcol { display: flex; flex-direction: column; align-items: center; }
.u { display: grid; grid-template-columns: .5em 1em .55em; grid-template-rows: 1.2em auto; }
.u-c { grid-row: 1; grid-column: 2; width: 1em; height: 1.2em; line-height: 1.2em; text-align: center; }
.u-k { grid-row: 1; grid-column: 1; align-self: end; justify-self: end; display: flex; flex-direction: column; align-items: center; font-family: var(--font); font-size: .44em; line-height: 1.02; color: var(--shu); padding-bottom: .15em; }
.u-o { grid-row: 1 / span 2; grid-column: 3; justify-self: start; display: flex; flex-direction: column; align-items: center; font-size: .5em; line-height: 1.04; padding-top: 1.1em; font-weight: 500; }
/* 縦書きで向きが変わる記号は字ごとに回す・寄せる */
.vterm .rot { display: inline-block; transform: rotate(90deg); }
.vterm .dotp { display: inline-block; transform: translate(.55em, -.5em); }
.term { display: grid; justify-items: center; gap: 12px; min-width: 0; }
.term-w { --vs: clamp(2.3rem, 9vw, 3rem); }
.term-s { --vs: clamp(1.9rem, 7.5vw, 2.5rem); }
.term-k { --vs: clamp(1.55rem, 6vw, 2rem); }
.kk-ps { font: 400 13px/1.9 var(--font); color: var(--text-2); max-width: 32em; text-align: center; }

/* kanbun markup in horizontal lines (例文・書き下し) */
.ok { font-size: .52em; vertical-align: .62em; margin-left: .04em; letter-spacing: 0; font-weight: 500; }
.kt { font-family: var(--font); font-size: .48em; vertical-align: -.28em; color: var(--shu); margin: 0 .06em; font-weight: 700; letter-spacing: 0; }

rt { font-size: .5em; color: var(--text-3); font-family: var(--font); }

/* ============ Flash card ============ */
.fcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 16px clamp(16px, 4.5vw, 24px) 18px; display: grid; gap: 12px; min-height: 340px; grid-template-rows: auto 1fr auto; cursor: pointer; box-shadow: var(--sh-1); transition: box-shadow var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out); }

.card-meta .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.card-meta .mode { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1.5 var(--font); color: var(--text-3); }
.card-meta .mode .ic { width: 14px; height: 14px; }
.card-body { display: grid; gap: 16px; align-content: center; min-width: 0; }
.card-front { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; padding-block: 16px; min-width: 0; }
.fcard.is-new .card-front { animation: rise var(--dur-slow) var(--ease-out) both; }
.card-back { border-top: 1px solid var(--border); padding-top: 16px; display: grid; gap: 14px; min-width: 0; align-content: start; animation: rise var(--dur-slow) var(--ease-out) both; }
.fcard.flipped .term-w { --vs: clamp(2rem, 7vw, 2.4rem); }
.fcard.flipped .term-s { --vs: clamp(1.7rem, 6vw, 2.1rem); }
.fcard.flipped .term-k { --vs: clamp(1.4rem, 5vw, 1.7rem); }
@media (min-width: 640px) {
  .fcard.split .card-body { grid-template-columns: minmax(0, 1fr) auto; align-items: start; }
  .fcard.split .card-front { grid-column: 2; grid-row: 1; padding: 4px 0 4px 20px; border-left: 1px solid var(--border); }
  .fcard.split .card-back { grid-column: 1; grid-row: 1; border-top: 0; padding-top: 4px; }
  .fcard.split .kk-ps { max-width: 13em; }
}
.tap-hint { display: flex; align-items: center; justify-content: center; gap: 6px; font: 500 12px/1.5 var(--font); color: var(--text-3); }
.tap-hint .ic { width: 14px; height: 14px; }
.front-mean { font: 500 clamp(1.15rem, 4.4vw, 1.4rem)/1.75 var(--font); max-width: 26em; color: var(--text); }

/* answer block */
.ans-row { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); gap: 12px; align-items: baseline; }
.ans-row.ex-row { align-items: start; }
.ans-row.ex-row .ans-label { padding-top: 4px; }
.ans-label { font: 700 11px/1.4 var(--font); letter-spacing: .12em; color: var(--text-3); }
.ans-read { font-family: var(--kan); font-size: 1.35rem; line-height: 2; overflow-wrap: anywhere; color: var(--text); }
.ans-mean { font: 500 17px/1.85 var(--font); overflow-wrap: anywhere; color: var(--text); }
/* 例文：縦書き。右から 白文 → 出典 → 書き下し → 訳 の順に並び、横にはみ出す分はスクロール */
.ex-wrap { min-width: 0; }
.ex-list { writing-mode: vertical-rl; display: flex; flex-direction: column; gap: 10px; height: 21rem; overflow-x: auto; overflow-y: hidden; min-width: 0; max-width: 100%; padding-block-end: 2px; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.ex { background: var(--surface-2); border-radius: var(--r-md); padding: 14px 10px; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--border); flex: none; }
.ex-kun { font-family: var(--kan); font-size: 1.22rem; line-height: 2.3; letter-spacing: .04em; color: var(--text); }
.ex-src { font: 700 12px/1.6 var(--font); color: var(--shu); }
.ex-kaki { font-family: var(--kan); font-size: 1.02rem; line-height: 2.1; color: var(--text); }
.ex-yaku { font: 400 14px/1.8 var(--font); color: var(--text-2); }
.ex .kt { vertical-align: -.35em; }
.ex .ok { vertical-align: .55em; }
.ex-help { font: 500 12px/1.6 var(--font); color: var(--text-3); margin-top: 6px; }

/* WASD pad */
.pad { display: grid; gap: 10px; justify-items: center; }
.pad-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
.pad-row .btn { flex-direction: column; gap: 4px; min-height: 64px; padding: 8px 6px; border-radius: 14px; font-size: 15px; }
.pad .skip { min-width: 33%; }
kbd { font: 500 11px/1 var(--mono); padding: 3px 6px; border-radius: 6px; background: color-mix(in oklab, currentColor 10%, transparent); border: 1px solid color-mix(in oklab, currentColor 22%, transparent); opacity: .9; white-space: nowrap; }
.kb { display: none; }
.kbd-hint { display: none; font: 500 12px/2.1 var(--font); color: var(--text-3); text-align: center; }
.kbd-hint kbd { color: var(--text-2); }
@media (hover: hover) and (pointer: fine) { .kb { display: inline; } .kbd-hint { display: block; } }

/* empty / done */
.empty { justify-items: center; text-align: center; padding-block: 32px; }
.empty .row { width: 100%; }
.empty .stats { width: 100%; max-width: 420px; }
.badgebig { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; animation: pop calc(var(--dur-slow) * 1.6) var(--ease-spring) .15s both; }
.badgebig .ic { width: 28px; height: 28px; stroke-width: 3; }

/* ============ Test ============ */
.q-card { gap: 8px; }
.q-ask { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.q { font: 700 17px/1.6 var(--font); color: var(--text); }
.q-term { padding-block: 12px; min-width: 0; }
.options { display: grid; gap: 8px; }

.opt:hover:not(:disabled) { border-color: var(--border-strong); background: var(--surface-2); transform: translateX(3px); }
.opt:disabled { cursor: default; }
.opt .key { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--surface-3); color: var(--text-2); font: 700 13px/1 var(--font); transition: background-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out); }
.opt .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .t.kan { font-family: var(--kan); font-size: 1.08rem; line-height: 2.1; }
.opt .mark { display: none; align-items: center; gap: 6px; margin-left: auto; font: 700 12px/1 var(--font); color: var(--accent-text); white-space: nowrap; flex: none; }
.opt .mark i { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.opt .mark .ic { width: 14px; height: 14px; stroke-width: 3.2; }
.opt.is-correct, .opt.is-wrong { border-color: var(--accent); background: var(--accent-soft); }
.opt.is-correct .key, .opt.is-wrong .key { background: var(--accent); color: var(--on-accent); }

.opt.is-correct .mark i, .opt.is-wrong .mark i { animation: pop calc(var(--dur-slow) * 1.5) var(--ease-spring) both; }
.opt.is-wrong { animation: shake .42s var(--ease-out); }
.opt.dim { opacity: .5; }
@media (max-width: 479px) { .opt .mark .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } }
.fb { border-color: var(--accent-line); background: color-mix(in oklab, var(--accent) 5%, var(--surface)); gap: 14px; animation: rise var(--dur-slow) var(--ease-out) both; }
.verdict { display: flex; align-items: center; gap: 10px; font: 700 18px/1.4 var(--font); color: var(--accent-text); }
.v-ic { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; animation: pop calc(var(--dur-slow) * 1.5) var(--ease-spring) both; }
.v-ic .ic { width: 16px; height: 16px; stroke-width: 3.2; }
.res-h { display: flex; align-items: center; gap: 20px; }
.res-h .sub { font: 500 13px/1.6 var(--font); color: var(--text-2); margin-top: 8px; }
.alert { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--r-md); background: var(--accent-soft); border: 1px solid var(--accent-line); }
.alert .ic { color: var(--accent-text); margin-top: 2px; width: 20px; height: 20px; }
.alert b { display: block; font: 700 14px/1.5 var(--font); color: var(--text); }
.miss-list { list-style: none; margin: 0; padding: 0; display: grid; }
.miss-list li { padding-block: 14px; border-top: 1px solid var(--border); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; }

.miss-list .term { --vs: 1.3rem; }
.miss-list .kk-ps { max-width: 12em; font-size: 12px; }
.miss-txt { display: grid; gap: 6px; min-width: 0; justify-items: start; font: 400 14px/1.7 var(--font); overflow-wrap: anywhere; }
.miss-line { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: start; width: 100%; }
.miss-line .ic { width: 16px; height: 16px; stroke-width: 3; margin-top: 4px; }
.miss-line .lbl { display: block; font: 700 11px/1.4 var(--font); letter-spacing: .08em; }
.miss-line.ok-l .ic, .miss-line.ok-l .lbl { color: var(--ok-text); }
.miss-line.ng-l .ic, .miss-line.ng-l .lbl { color: var(--ng-text); }
.miss-line.ng-l .v { color: var(--text-2); }

/* ============ Footer / dialog / toast ============ */
.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding-block: 20px 40px; border-top: 1px solid var(--border); font: 400 13px/1.6 var(--font); color: var(--text-3); }
.save { display: inline-flex; align-items: center; gap: 8px; }
.save .ic { width: 16px; height: 16px; }

.overlay { position: fixed; inset: 0; z-index: 30; background: var(--scrim); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); display: flex; justify-content: center; align-items: flex-start; padding: calc(env(safe-area-inset-top, 0px) + 12vh) 16px 16px; animation: fade var(--dur-base) var(--ease-out) both; }
.dialog { width: 100%; max-width: 440px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 24px; display: grid; gap: 14px; box-shadow: var(--sh-3); animation: rise var(--dur-slow) var(--ease-out) both; }
.d-ic { width: 44px; height: 44px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; }
.dialog h2 { font: 700 18px/1.5 var(--font); }
.dialog p { font: 400 14px/1.7 var(--font); color: var(--text-2); }
.dialog-actions { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
.toast-host { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); z-index: 40; display: flex; justify-content: center; padding-inline: 16px; pointer-events: none; }

.toast .t-ok { width: 24px; height: 24px; border-radius: 50%; background: oklch(.72 .14 155); color: oklch(.2 .03 265); display: grid; place-items: center; flex: none; }
.toast .t-ok .ic { width: 14px; height: 14px; stroke-width: 3; }

/* ============ Keyframes ============ */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }
@keyframes grow { from { width: 0; } }
@keyframes ring-draw { from { stroke-dasharray: 0 100; } }
@keyframes pop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 55% { transform: translateX(4px); } 80% { transform: translateX(-2px); } }
@keyframes toast { 0% { opacity: 0; transform: translateY(14px) scale(.98); } 10% { opacity: 1; transform: none; } 86% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(8px); } }

@media (prefers-reduced-motion: reduce) {
  :root { --dur-fast: 1ms; --dur-base: 1ms; --dur-slow: 1ms; }
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-in">
      <div class="brand"><span class="logo" aria-hidden="true">漢</span><span>入試漢文ドリル</span></div>
      <div class="seg theme-seg" role="group" aria-label="カラーモード">
        <span class="seg-ind"></span>
        <button type="button" data-mode="light" aria-pressed="true" aria-label="ライト"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg><span class="lbl">ライト</span></button>
        <button type="button" data-mode="dark" aria-pressed="false" aria-label="ダーク"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span class="lbl">ダーク</span></button>

      <button type="button" role="tab" class="vtab" id="tab-test" data-view="test"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>ミニテスト</button>

</header>

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
const KANJI = "[\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uF900-\\uFAFF々〆ヶ]";
const RUBY_RE = new RegExp("(" + KANJI + "+)《([ぁ-ゖー・]+)》", "g");

/* 線のアイコン（24×24、stroke 2） */

};
function icon(name, cls) { return '<svg class="ic' + (cls ? " " + cls : "") + '" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + "</svg>"; }

/* 横書き用：《ひらがな》はルビ、《カタカナ》は送り仮名、〔 〕は返り点 */
function mk(s) {
  let h = esc(s);
  h = h.replace(RUBY_RE, "<ruby>$1<rt>$2</rt></ruby>");
  h = h.replace(/《([^》]*)》/g, '<span class="ok">$1</span>');
  h = h.replace(/〔([^〕]*)〕/g, '<span class="kt">$1</span>');
  return h;
}

/* ---------- 縦書きの見出し ---------- */
const toFull = ch => /[A-Za-z0-9]/.test(ch) ? String.fromCharCode(ch.charCodeAt(0) + 0xFEE0) : ch === "," ? "、" : ch;
const KANA = /[ァ-ヶーぁ-ゖ]/;
const PUNCT = /[。、，・／]/;
/* 句形：本体を縦の列に分け、（注記）と※以下は横書きの補足に回す */
function parseKukei(s) {
  let main = s, star = "";
  const p = s.indexOf("※");
  if (p >= 0) { main = s.slice(0, p); star = "※" + s.slice(p + 1).trim(); }
  const chars = [...main.trim()];
  const cols = [[]], notes = [];
  let cur = cols[0], depth = 0, par = "";
  const last = () => { if (!cur.length) cur.push({ c: "", o: "", k: "" }); return cur[cur.length - 1]; };
  for (let i = 0; i < chars.length; i++) {
    const ch = chars[i];
    if (depth > 0) {
      par += ch;
      if (ch === "（") depth++;
      else if (ch === "）" && --depth === 0) { notes.push(par); par = ""; }
      continue;
    }
    if (ch === "（") { depth = 1; par = "（"; continue; }
    if (ch === "《" || ch === "〔") {
      const close = ch === "《" ? "》" : "〕";
      let j = chars.indexOf(close, i + 1); if (j < 0) j = chars.length;
      const t = chars.slice(i + 1, j).join("");
      if (ch === "《") last().o += t; else last().k += t;
      i = j; continue;
    }
    if (ch === "／") { cur = []; cols.push(cur); continue; }
    if (/\s/.test(ch)) continue;
    cur.push({ c: toFull(ch), o: "", k: "" });
  }
  if (par) notes.push(par);
  if (star) notes.push(star);
  return { cols: cols.filter(c => c.length), notes };
}
/* 単語・成句：漢字に続くかなを送り仮名として右下へ */
function parsePlain(s) {
  const cur = [];
  for (const raw of s) {
    const ch = toFull(raw);
    if (/\s/.test(ch)) continue;
    const prev = cur[cur.length - 1];
    if (KANA.test(ch) && prev && !PUNCT.test(prev.c)) { prev.o += ch; continue; }
    cur.push({ c: ch, o: "", k: "" });
  }
  return [cur];
}
const ROT = /[～〜ー－‐\-（）()［］\[\]「」『』…‥：]/;
const DOTP = /[、。，．]/;
function glyph(ch) {
  const cls = ROT.test(ch) ? "rot" : DOTP.test(ch) ? "dotp" : "";
  return cls ? '<span class="' + cls + '">' + esc(ch) + "</span>" : esc(ch);
}
function stackHTML(s) { return [...s].map(ch => "<span>" + glyph(ch) + "</span>").join(""); }
function unitHTML(u) {
  return '<span class="u"><span class="u-c">' + glyph(u.c) + "</span>" +
    (u.k ? '<span class="u-k">' + stackHTML(u.k) + "</span>" : "") +
    (u.o ? '<span class="u-o">' + stackHTML(u.o) + "</span>" : "") + "</span>";
}
function plainTerm(s) { return s.replace(/〔[^〕]*〕|[《》]/g, ""); }
function vtermHTML(cols, label) {
  return '<div class="vterm" role="img" aria-label="' + esc(label) + '">' + cols.map(col => '<span class="vcol" aria-hidden="true">' + col.map(unitHTML).join("") + "</span>").join("") + "</div>";
}
function termHTML(it) {
  if (it.deck === "k") {
    const p = parseKukei(it.term);
    return '<div class="term term-k">' + vtermHTML(p.cols, plainTerm(it.term)) + (p.notes.length ? '<div class="kk-ps">' + p.notes.map(mk).join("　") + "</div>" : "") + "</div>";
  }
  return '<div class="term term-' + it.deck + '">' + vtermHTML(parsePlain(it.term), it.term) + "</div>";
}

/* 成句：疑問／反語などの併記を行に分ける */
function fmtAlt(s) {
  const parts = String(s).split("/").map(x => x.trim()).filter(Boolean);
  if (parts.length === 1) return esc(parts[0]);
  return parts.map(x => {
    const m = x.match(/^(疑問|反語)：(.*)$/);
    return m ? '<span class="alt"><span class="tag acc ' + (m[1] === "疑問" ? "a-blue" : "a-violet") + '">' + m[1] + "</span>" + esc(m[2]) + "</span>" : '<span class="alt">' + esc(x) + "</span>";
  }).join("");
}
function readHTML(it) {
  if (it.deck === "k") return mk(it.read);
  if (it.deck === "s") return fmtAlt(it.read);
  return esc(it.read);
}
function meanHTML(it) { return it.deck === "s" ? fmtAlt(it.mean) : esc(it.mean); }
function exHTML(it) {
  if (!it.ex || !it.ex.length) return "";
  return '<div class="ans-row ex-row"><span class="ans-label">例文</span><div class="ex-wrap"><div class="ex-list">' + it.ex.map(e =>
    '<div class="ex"><div class="ex-kun">' + mk(e.kun) + "</div>" +
    (e.src ? '<div class="ex-src">' + esc(e.src) + "</div>" : "") +
    '<div class="ex-kaki">' + mk(e.kaki) + "</div>" +
    '<div class="ex-yaku">' + esc(e.yaku) + "</div></div>").join("") + '</div>' +
    (it.ex.length > 1 ? '<p class="ex-help">例文は' + it.ex.length + "つあります。右から順に読み、入りきらない分は横にスクロールできます。</p>" : "") + "</div></div>";
}
function rowHTML(label, cls, body) { return '<div class="ans-row"><span class="ans-label">' + label + '</span><div class="' + cls + '">' + body + "</div></div>"; }

/* ---------- progress store ---------- */
const LS_KEY = "kanbun-drill-progress-v1";
const LS_PREF = "kanbun-drill-prefs-v2";
const LS_THEME = "kanbun-drill-theme";
function readLS(k) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function writeLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const LOCAL_OK = (() => { try { localStorage.setItem("__kd", "1"); localStorage.removeItem("__kd"); return true; } catch (e) { return false; } })();

function blankStore() { return { v: 1, cards: {}, tests: [], updatedAt: 0 }; }
function sanitize(o) {
  const s = blankStore();
  if (!o || typeof o !== "object") return s;
  if (o.cards && typeof o.cards === "object") {
    for (const [k, c] of Object.entries(o.cards)) {
      if (!ITEM[k] || !c || typeof c !== "object") continue;
      s.cards[k] = { s: [0, 1, 2].includes(c.s) ? c.s : 0, c: Math.max(0, +c.c || 0), w: Math.max(0, +c.w || 0), t: +c.t || 0 };
    }
  }
  if (Array.isArray(o.tests)) {
    s.tests = o.tests.filter(t => t && typeof t === "object").slice(-30)
      .map(t => ({ d: +t.d || 0, deck: String(t.deck || ""), type: String(t.type || ""), n: +t.n || 0, ok: +t.ok || 0 }));
  }
  s.updatedAt = +o.updatedAt || 0;
  return s;
}
let store = sanitize(readLS(LS_KEY));

const prefDefaults = { cDeck: DEFAULT_DECK, cGroup: "", cFilter: "todo", cOrder: "num", cSwap: false, tDeck: DEFAULT_DECK, tGroup: "", tType: "mean", tN: 10, tPrio: "weak" };
let prefs = Object.assign({}, prefDefaults, readLS(LS_PREF) || {});
if (!DECK[prefs.cDeck] && prefs.cDeck !== "all") prefs.cDeck = DEFAULT_DECK;
if (!DECK[prefs.tDeck] && prefs.tDeck !== "all") prefs.tDeck = DEFAULT_DECK;
function savePrefs() { writeLS(LS_PREF, prefs); }

function card(id) { return store.cards[id] || { s: 0, c: 0, w: 0, t: 0 }; }
function setCard(id, patch) { store.cards[id] = Object.assign({}, card(id), patch, { t: Date.now() }); persist(); }
function persist() { store.updatedAt = Date.now(); writeLS(LS_KEY, store); scheduleCloud(); }

/* アカウント保存（db）: 使えるときだけ。使えなければブラウザ保存のみ */
const cloud = { mode: "local", ref: null, writing: false, pending: false, timer: null, retried: false };
async function initCloud() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  cloud.mode = "checking"; updateSaveState();
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) { cloud.mode = "local"; updateSaveState(); return; }
    const ref = db.doc("data/users/" + uid + "/progress");
    const snap = await ref.get();
    cloud.ref = ref; cloud.mode = "cloud";
    if (snap.exists) {
      const remote = sanitize(snap.data());
      if (remote.updatedAt > store.updatedAt) { store = remote; writeLS(LS_KEY, store); render(); }
      else if (store.updatedAt > remote.updatedAt) scheduleCloud(0);
    } else if (store.updatedAt) scheduleCloud(0);
  } catch (e) { cloud.mode = "local"; }
  updateSaveState();
}
function scheduleCloud(delay = 1200) {
  if (cloud.mode !== "cloud") return;
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(flushCloud, delay);
}
async function flushCloud() {
  cloud.timer = null;
  if (cloud.mode !== "cloud" || !cloud.ref) return;
  if (cloud.writing) { cloud.pending = true; return; }
  cloud.writing = true; cloud.pending = false;
  try {
    await cloud.ref.set(JSON.parse(JSON.stringify(store)));
    cloud.retried = false;
  } catch (e) {
    const code = e && e.code;
    if ((code === "unavailable" || code === "resource_exhausted") && !cloud.retried) { cloud.retried = true; cloud.pending = true; }
    else if (code === "quota_exceeded" || code === "unavailable" || code === "resource_exhausted") { cloud.retried = false; }
    else { cloud.mode = "local"; }
  } finally {
    cloud.writing = false;
    updateSaveState();
    if (cloud.pending && cloud.mode === "cloud") scheduleCloud(cloud.retried ? 2500 + Math.random() * 2000 : 600);
  }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && cloud.timer) { clearTimeout(cloud.timer); flushCloud(); } });

function updateSaveState() {
  const el = $("#saveState");
  if (cloud.mode === "cloud") el.textContent = "進捗はあなたのアカウントに保存されます（ほかの端末でも続きから）";
  else if (cloud.mode === "checking") el.textContent = "保存先を確認しています…";
  else if (LOCAL_OK) el.textContent = "進捗はこのブラウザに保存されます";
  else el.textContent = "この表示では進捗を保存できません（閉じると消えます）";
}

/* ---------- theme ---------- */
const darkMQ = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
function storedTheme() { try { const t = localStorage.getItem(LS_THEME); return t === "light" || t === "dark" ? t : null; } catch (e) { return null; } }
let themeTimer = null;
function applyTheme(t, animate) {
  const root = document.documentElement;
  if (animate) {
    root.classList.add("theme-anim");
    clearTimeout(themeTimer);
    themeTimer = setTimeout(() => root.classList.remove("theme-anim"), 420);
  }
  root.setAttribute("data-theme", t);
  document.querySelectorAll(".theme-seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === t)));
}
document.querySelectorAll(".theme-seg button").forEach(b => b.addEventListener("click", () => {
  try { localStorage.setItem(LS_THEME, b.dataset.mode); } catch (e) {}
  applyTheme(b.dataset.mode, true);
}));
if (darkMQ) {
  const onOS = e => { if (!storedTheme()) applyTheme(e.matches ? "dark" : "light", true); };
  if (darkMQ.addEventListener) darkMQ.addEventListener("change", onOS); else if (darkMQ.addListener) darkMQ.addListener(onOS);
}
applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light", false);

/* ---------- counts ---------- */
function itemsOf(deck, group) {
  let items = deck === "all" ? ALL_ITEMS : DECK[deck].items;
  if (group && deck !== "all") items = items.filter(it => it.g === group);
  return items;
}
function countOf(items) {
  let k = 0, m = 0;
  for (const it of items) { const s = card(it.id).s; if (s === 2) k++; else if (s === 1) m++; }
  return { k, m, n: items.length - k - m, total: items.length };
}
function pctOf(x, total) { return total ? x / total * 100 : 0; }
function countLabel(c) { return "覚えた " + c.k + "、あいまい " + c.m + "、未学習 " + c.n; }
function barHTML(c, thin) {
  return '<div class="stack' + (thin ? " thin" : "") + '" role="img" aria-label="' + countLabel(c) + '"><i class="k" style="width:' + pctOf(c.k, c.total).toFixed(2) + '%"></i><i class="m" style="width:' + pctOf(c.m, c.total).toFixed(2) + '%"></i></div>';
}
/* 円グラフ：parts は [割合(%), 色クラス] を先頭から順に。円周 100 の円で、後ろの区間から重ねて描く */
function ringHTML(size, parts, label, inner) {
  let acc = 0;
  const arcs = [];
  parts.forEach(([p, cls]) => { acc += p; if (p > 0) arcs.push('<circle class="val ' + cls + '" cx="18" cy="18" r="15.9155" stroke-dasharray="' + Math.min(acc, 100).toFixed(2) + ' 100"></circle>'); });
  return '<div class="ring" style="--s:' + size + 'px" role="img" aria-label="' + esc(label) + '"><svg viewBox="0 0 36 36" aria-hidden="true"><circle class="trk" cx="18" cy="18" r="15.9155"></circle>' + arcs.reverse().join("") + '</svg><span class="ring-n" aria-hidden="true"><span>' + inner + "</span></span></div>";
}
function statsHTML(c, labels, cls) {
  const L = labels || ["覚えた", "あいまい", "未学習"];
  return '<div class="stats' + (cls ? " " + cls : "") + '">' +
    '<div class="stat"><span class="lab"><span class="dot k"></span>' + L[0] + '</span><b>' + c.k + "</b></div>" +
    '<div class="stat"><span class="lab"><span class="dot m"></span>' + L[1] + '</span><b>' + c.m + "</b></div>" +
    '<div class="stat"><span class="lab"><span class="dot n"></span>' + L[2] + '</span><b>' + c.n + "</b></div></div>";
}
/* セッションの進み具合：前回の位置から伸ばす */
function trackHTML(sess, pct) {
  const from = sess.lastPct == null ? pct : sess.lastPct;
  sess.lastPct = pct;
  return '<div class="track" role="progressbar" aria-label="進み具合" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(pct) + '"><i style="width:' + from.toFixed(1) + '%" data-to="' + pct.toFixed(1) + '"></i></div>';
}
function settleTracks() {
  document.querySelectorAll(".track i[data-to]").forEach(el => { void el.offsetWidth; el.style.width = el.dataset.to + "%"; });
}
const STATUS = ["未学習", "あいまい", "覚えた"];
const STATUS_CLS = ["chip", "chip tint acc a-amber", "chip tint acc a-green"];
function chipHTML(id) { const s = card(id).s; return '<span class="' + STATUS_CLS[s] + '"><span class="dot"></span>' + STATUS[s] + "</span>"; }
function deckLabel(id) { return id === "all" ? "すべて" : DECK[id].short; }
function deckChip(id, text) { return '<span class="chip tint dk-' + id + '"><span class="dot"></span>' + esc(text) + "</span>"; }

/* 画面を切り替えたとき・問題が進んだときだけ、上から順にふわっと出す */
function riseIn() {
  [...$("#app").children].forEach((el, i) => { el.classList.add("rise"); el.style.setProperty("--d", Math.min(i, 5) * 60 + "ms"); });
}
/* 設定を変えて描き直しても、操作中のコントロールにフォーカスを戻す */
function keepFocus(fn) {
  const a = document.activeElement;
  const id = a && a.id;
  fn();
  if (id) { const el = document.getElementById(id); if (el && el !== document.activeElement) el.focus({ preventScroll: true }); }
}

/* ---------- view switching ---------- */
let view = "home";
let entering = true;
function go(v) { view = v; entering = true; render(); window.scrollTo(0, 0); }
document.querySelectorAll(".vtab").forEach(b => b.addEventListener("click", () => go(b.dataset.view)));
function render() {
  document.querySelectorAll(".vtab").forEach((b, i) => {
    const on = b.dataset.view === view;
    b.setAttribute("aria-selected", String(on));
    if (on) $(".vtabs").style.setProperty("--i", i);
  });
  if (view === "cards") renderCards();
  else if (view === "test") renderTest();
  else renderHome();
  if (entering) { riseIn(); entering = false; }
  updateSaveState();
}

/* ---------- home ---------- */
function fmtDate(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, "0");
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function renderHome() {
  const all = countOf(ALL_ITEMS);
  const kp = pctOf(all.k, all.total), mp = pctOf(all.m, all.total);
  let h = '<section class="card hero"><div class="hero-h">' +
    ringHTML(112, [[kp, "k"], [mp, "m"]], countLabel(all), Math.round(kp) + "<small>%</small>") +
    '<div class="hero-t"><p class="over">全体の進み具合</p>' +
    '<p class="big">' + all.k + "<small>/ " + TOTAL + " 項目を覚えた</small></p></div></div>" +
    statsHTML(all) + "</section>";

  h += '<section class="decks">';
  for (const d of DECKS) {
    const c = countOf(d.items);
    h += '<article class="card deck dk-' + d.id + '">' +
      '<div class="deck-top"><span class="dmark" aria-hidden="true">' + esc(d.badge) + '</span><div class="deck-t"><h3>' + esc(d.name) + "</h3><p>" + esc(d.desc) + "</p></div></div>" +
      '<div class="prog">' + barHTML(c) + '<span class="pct"><b>' + c.k + "</b> / " + c.total + "</span></div>" +
      '<details class="grp-d"><summary>' + icon("chev", "chev") + '範囲別に見る<span class="count">' + d.groups.length + '</span></summary><div class="groups">' +
      d.groups.map(g => { const gc = countOf(d.items.filter(it => it.g === g)); return '<div class="grp"><span>' + esc(g) + "</span>" + barHTML(gc, true) + '<span class="g-c num">' + gc.k + "/" + gc.total + "</span></div>"; }).join("") +
      "</div></details>" +
      '<div class="row"><button type="button" class="btn soft" data-act="cards" data-deck="' + d.id + '">' + icon("cards") + 'カードで覚える</button><button type="button" class="btn secondary" data-act="test" data-deck="' + d.id + '">' + icon("quiz") + "テストする</button></div></article>";
  }
  h += "</section>";

  const recent = store.tests.slice(-8).reverse();
  h += '<section class="card"><div class="sec-h"><h2 class="h3">最近のテスト</h2>' + (recent.length ? '<span class="cap">新しい順・' + recent.length + "回</span>" : "") + "</div>";
  if (!recent.length) h += '<p class="note">まだテストの記録はありません。「ミニテスト」から10問で試せます。</p>';
  else h += '<ul class="history">' + recent.map(t => {
    const id = t.deck in DECK ? t.deck : "all";
    const good = t.n && t.ok / t.n >= 0.8;
    return "<li>" + (id === "all" ? '<span class="chip"><span class="dot"></span>すべて</span>' : deckChip(id, DECK[id].short)) +
      '<div class="h-t"><b>' + (t.type === "read" ? "読み方" : "意味") + '</b><span class="num">' + fmtDate(t.d) + "</span></div>" +
      '<span class="score num' + (good ? " good" : "") + '">' + (good ? icon("check") + '<span class="sr">8割以上</span>' : "") + t.ok + " / " + t.n + "</span></li>";
  }).join("") + "</ul>";

  $("#app").querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => {

}

function makeSession(ids, label) { return { queue: ids, i: 0, flipped: false, known: 0, again: 0, skipped: 0, retryIds: [], label: label || "", fresh: true, lastPct: null }; }
function newCardSession() {
  let items = itemsOf(prefs.cDeck, prefs.cGroup);

  if (f === "todo") items = items.filter(it => card(it.id).s < 2);
  else if (f === "mid") items = items.filter(it => card(it.id).s === 1);

  let ids = items.map(it => it.id);

}

function bindCards() {

function focusCard() { const c = $("#card"); if (c) c.focus({ preventScroll: true }); }
function cardActive() { return view === "cards" && cs && cs.queue.length && cs.i < cs.queue.length; }
function toggleCard() { if (!cardActive()) return; cs.flipped = !cs.flipped; renderCards(); focusCard(); }
function answerCard(kind) {
  if (!cardActive()) return;
  const id = cs.queue[cs.i];
  if (kind === "known") { setCard(id, { s: 2 }); cs.known++; }
  else if (kind === "again") { setCard(id, { s: 1 }); cs.again++; cs.retryIds.push(id); }
  else { cs.skipped++; cs.retryIds.push(id); }

/* ---------- mini test ---------- */
let ts = null;
const TYPE_ASK = { mean: "意味として正しいものはどれ？", read: "読み方として正しいものはどれ？" };
function splitTokens(it, text) {
  const re = it.deck === "w" ? /[、，,／\/]/ : it.deck === "k" ? /[／\/・]/ : /[\/／]/;
  return String(text).split(re).map(x => x.replace(/（[^）]*）|[。\s]/g, "").replace(/^(疑問|反語)：/, "")).filter(Boolean);
}
function makeQuestion(it, type) {
  const field = type === "read" ? "read" : "mean";
  const correct = it[field];
  const used = new Set(splitTokens(it, correct));
  const opts = [{ text: correct, id: it.id }];
  for (const x of shuffle(DECK[it.deck].items)) {
    if (x.id === it.id) continue;
    const t = x[field];
    const toks = splitTokens(x, t);
    if (!toks.length || toks.some(k => used.has(k)) || opts.some(o => o.text === t)) continue;
    toks.forEach(k => used.add(k));
    opts.push({ text: t, id: x.id });
    if (opts.length === 4) break;
  }
  const mixed = shuffle(opts);
  return { id: it.id, type, opts: mixed, ans: mixed.findIndex(o => o.id === it.id) };
}
function optHTML(it, text, type) {
  if (it.deck === "k" && type === "read") return mk(text);
  if (it.deck === "s") return fmtAlt(text);
  return esc(text);
}
function startTest() {
  let pool = itemsOf(prefs.tDeck, prefs.tGroup).slice();
  if (prefs.tPrio === "weak") {
    const r = new Map(pool.map(it => [it.id, Math.random()]));
    pool.sort((a, b) => card(a.id).s - card(b.id).s || card(b.id).w - card(a.id).w || r.get(a.id) - r.get(b.id));
  } else pool = shuffle(pool);
  const picked = shuffle(pool.slice(0, Math.min(+prefs.tN, pool.length)));
  ts = { phase: "q", qs: picked.map(it => makeQuestion(it, prefs.tType)), i: 0, picked: null, ok: 0, wrong: [], deck: prefs.tDeck, type: prefs.tType, lastPct: null };
  renderTest();
  riseIn();
  window.scrollTo(0, 0);
}
function renderTest() {
  if (!ts || ts.phase === "setup") return renderTestSetup();
  if (ts.phase === "done") return renderTestResult();
  const q = ts.qs[ts.i];
  const it = ITEM[q.id];
  const answered = ts.picked !== null;
  let h = '<div class="sbar"><span class="num">問 <b>' + (ts.i + 1) + "</b> / " + ts.qs.length + "</span>" + trackHTML(ts, ts.i / ts.qs.length * 100) + '<span class="sb-ok num">' + icon("check") + "正解 " + ts.ok + "</span></div>";
  h += '<section class="card q-card"><div class="q-ask">' + deckChip(it.deck, DECK[it.deck].short + " No." + it.no) + '<p class="q">' + TYPE_ASK[q.type] + '</p></div><div class="q-term">' + termHTML(it) + "</div></section>";
  h += '<div class="options" role="group" aria-label="選択肢">' + q.opts.map((o, i) => {
    let cls = "opt", mark = "";
    if (answered) {
      if (i === q.ans) { cls += " acc a-green is-correct"; mark = "<i>" + icon("check") + '</i><span class="lbl">正解</span>'; }
      else if (i === ts.picked) { cls += " acc a-coral is-wrong"; mark = "<i>" + icon("x") + '</i><span class="lbl">あなたの答え</span>'; }
      else cls += " dim";
    }
    const kan = q.type === "read" ? " kan" : "";
    return '<button type="button" class="' + cls + '" data-i="' + i + '"' + (answered ? " disabled" : "") + '><span class="key num">' + (i + 1) + '</span><span class="t' + kan + '">' + optHTML(it, o.text, q.type) + '</span><span class="mark">' + mark + "</span></button>";
  }).join("") + "</div>";
  if (answered) {
    const ok = ts.picked === q.ans;
    h += '<section class="card fb acc ' + (ok ? "a-green" : "a-coral") + '"><div class="verdict"><span class="v-ic">' + icon(ok ? "check" : "x") + "</span>" + (ok ? "正解" : "不正解") + "</div>" +
      rowHTML("読み", "ans-read", readHTML(it)) + rowHTML("意味", "ans-mean", meanHTML(it)) + (it.deck === "k" ? exHTML(it) : "") + "</section>";
    h += '<div class="row end"><button type="button" class="btn primary" id="tNext">' + (ts.i + 1 < ts.qs.length ? "次の問題へ" : "結果を見る") + icon("arrow", "arrow") + "</button></div>";
  }
  h += '<p class="kbd-hint">キーボード：<kbd>1</kbd>〜<kbd>4</kbd> 選ぶ　<kbd>Enter</kbd> 次へ</p>';
  $("#app").innerHTML = h;
  settleTracks();
  $("#app").querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => pickOption(+b.dataset.i)));
  const nx = $("#tNext");
  if (nx) { nx.addEventListener("click", nextQuestion); nx.focus({ preventScroll: true }); }
}
function pickOption(i) {
  if (!ts || ts.phase !== "q" || ts.picked !== null) return;
  const q = ts.qs[ts.i];
  if (i < 0 || i >= q.opts.length) return;
  ts.picked = i;
  const c = card(q.id);
  if (i === q.ans) { ts.ok++; setCard(q.id, { s: 2, c: c.c + 1 }); }
  else { ts.wrong.push({ id: q.id, type: q.type, yours: q.opts[i].text }); setCard(q.id, { s: 1, w: c.w + 1 }); }
  renderTest();
}
function nextQuestion() {
  if (!ts || ts.picked === null) return;
  ts.i++; ts.picked = null;
  if (ts.i >= ts.qs.length) {
    ts.phase = "done";
    store.tests.push({ d: Date.now(), deck: ts.deck, type: ts.type, n: ts.qs.length, ok: ts.ok });
    if (store.tests.length > 30) store.tests = store.tests.slice(-30);
    persist();
  }
  renderTest();
  riseIn();
  window.scrollTo(0, 0);
}
function renderTestSetup() {

  $("#tGroup").addEventListener("change", e => { prefs.tGroup = e.target.value; re(); });

function renderTestResult() {
  const n = ts.qs.length, rate = n ? Math.round(ts.ok / n * 100) : 0;
  const good = rate >= 80;
  let h = '<section class="card"><p class="over">テスト結果・' + esc(deckLabel(ts.deck)) + "・" + (ts.type === "read" ? "読み方" : "意味") + "</p>" +

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = e.target && e.target.tagName;
  if (tag === "SELECT" || tag === "INPUT" || tag === "TEXTAREA") return;
  const key = e.key || "", code = e.code || "", low = key.toLowerCase();
  const isSpace = key === " " || code === "Space";
  if (cardActive()) {
    // フォーカス中のボタンやメニューは Space / Enter で普通に押せるようにする
    if ((isSpace || key === "Enter") && (tag === "BUTTON" || tag === "SUMMARY")) return;
    let act = null;
    if (isSpace || code === "KeyS" || low === "s") act = "toggle";
    else if (code === "KeyA" || low === "a" || key === "ArrowLeft") act = "again";
    else if (code === "KeyD" || low === "d" || key === "ArrowRight") act = "known";
    else if (code === "KeyW" || low === "w") act = "skip";
    else if (key === "Enter" && e.target.id === "card") act = "toggle";
    if (!act) return;
    e.preventDefault();
    if (e.repeat) return;
    if (act === "toggle") toggleCard(); else answerCard(act);
  } else if (view === "test" && ts && ts.phase === "q") {
    if (ts.picked === null && /^[1-4]$/.test(key)) { e.preventDefault(); pickOption(+key - 1); }
    else if (ts.picked !== null && key === "Enter" && tag !== "BUTTON") { e.preventDefault(); nextQuestion(); }
  }
});

/* ---------- toast ---------- */
let toastTimer = null;
function showToast(msg) {
  const host = $("#toastHost");
  clearTimeout(toastTimer);
  host.innerHTML = '<div class="toast" role="status"><span class="t-ok">' + icon("check") + "</span>" + esc(msg) + "</div>";
  toastTimer = setTimeout(() => { host.innerHTML = ""; }, 2700);
}

/* ---------- reset ---------- */
function bindReset() {
  const area = $("#resetArea");
  area.innerHTML = '<button type="button" class="btn ghost sm" id="resetBtn">' + icon("trash") + "進捗をリセット</button>";
  $("#resetBtn").addEventListener("click", openResetDialog);
}
function openResetDialog() {
  if ($("#resetOverlay")) return;
  const ov = document.createElement("div");
  ov.className = "overlay"; ov.id = "resetOverlay";
  ov.innerHTML = '<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="resetTitle" aria-describedby="resetDesc">' +
    '<span class="d-ic acc a-coral">' + icon("warn") + "</span>" +
    '<h2 id="resetTitle">進捗をリセットしますか？</h2>' +
    '<p id="resetDesc">覚えた・あいまいの記録とテスト結果がすべて消えます。元には戻せません。</p>' +
    '<div class="dialog-actions"><button type="button" class="btn soft acc a-coral" id="resetYes">' + icon("trash") + '消す</button><button type="button" class="btn primary" id="resetNo">やめる</button></div></div>';
  document.body.appendChild(ov);
  const close = () => { ov.remove(); document.removeEventListener("keydown", onKey, true); const b = $("#resetBtn"); if (b) b.focus(); };
  const onKey = e => { if (e.key === "Escape") { e.preventDefault(); close(); } else if (e.key !== "Tab" && e.key !== "Enter" && e.key !== " ") { e.stopPropagation(); } };
  document.addEventListener("keydown", onKey, true);
  ov.addEventListener("click", e => { if (e.target === ov) close(); });
  $("#resetNo").addEventListener("click", close);
  $("#resetYes").addEventListener("click", () => {
    store = blankStore(); persist();
    if (cloud.timer) { clearTimeout(cloud.timer); flushCloud(); }
    cs = null; ts = null; close(); entering = true; render();
    showToast("進捗をリセットしました");
  });
  $("#resetNo").focus();
}

bindReset();
render();
initCloud();
</script>
</body>
</html>
